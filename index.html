<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Cinco kilómetros</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap">
<style>
/* Concepto: un libro de tapa dura que se hojea. La pista de atletismo vista desde arriba (carriles) es el motivo de portada y de las páginas de capítulo. */
:root{
  --desk:#DCE2DF; --desk-2:#C6CFCB;
  --paper:#F5F7F5; --ink:#15262B; --ink-soft:#52646A; --rule:rgba(21,38,43,.16);
  --accent:#C43B1F; --accent-soft:rgba(196,59,31,.10);
  --cover:#123B45; --cover-deep:#0B2931; --foil:#E6C879; --foil-hi:#F6E7B4;
  --ctrl:rgba(255,255,255,.78); --ctrl-ink:#15262B; --shadow:rgba(10,28,34,.42);
  --font-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --font-body:"Newsreader",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#0C1316; --desk-2:#050A0C;
    --paper:#1A2428; --ink:#E7EEEC; --ink-soft:#9DB1B4; --rule:rgba(231,238,236,.16);
    --accent:#FF8A66; --accent-soft:rgba(255,138,102,.12);
    --ctrl:rgba(26,36,40,.86); --ctrl-ink:#E7EEEC; --shadow:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#0C1316; --desk-2:#050A0C;
  --paper:#1A2428; --ink:#E7EEEC; --ink-soft:#9DB1B4; --rule:rgba(231,238,236,.16);
  --accent:#FF8A66; --accent-soft:rgba(255,138,102,.12);
  --ctrl:rgba(26,36,40,.86); --ctrl-ink:#E7EEEC; --shadow:rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; overflow:hidden;
  background-color:var(--desk);
  background-image:radial-gradient(120% 90% at 50% 38%, var(--desk) 0%, var(--desk-2) 100%);
  color:var(--ink); font-family:var(--font-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:3px}

.desk{height:100%; display:grid; grid-template-rows:minmax(0,1fr) auto; row-gap:12px; padding-block:14px 12px}
.stagewrap{min-height:0; min-width:0; display:grid; place-items:center}
.stage{position:relative; touch-action:pan-y}

/* ---------- Barra de control ---------- */
.bar{display:flex; justify-content:center; align-items:center; gap:8px; flex-wrap:wrap}
.btn{
  display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 18px;
  border:0; border-radius:999px; background:var(--ctrl); color:var(--ctrl-ink); cursor:pointer;
  font:600 13px/1 var(--font-display); letter-spacing:.04em;
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset, 0 6px 18px -8px var(--shadow);
  transition:transform .15s ease, background .15s ease;
}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.4; cursor:default}
.btn svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.btn.primary{background:var(--cover); color:var(--foil-hi)}
.status{min-width:150px; text-align:center; font:600 12px/1 var(--font-display); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft)}

/* ---------- Modo libro abierto (pantallas anchas) ---------- */
.flip .book-scale{position:absolute; left:0; top:0; width:1200px; height:820px; transform-origin:0 0}
.flip .book{position:relative; width:1200px; height:820px; perspective:3200px; transition:transform .9s cubic-bezier(.45,.05,.25,1)}
.flip .book.at-start{transform:translateX(-300px)}
.flip .book.at-end{transform:translateX(300px)}
.flip .book::before{
  content:""; position:absolute; left:50px; right:50px; bottom:-30px; height:44px;
  background:radial-gradient(ellipse at center, var(--shadow) 0%, transparent 70%); filter:blur(12px); opacity:.9; pointer-events:none;
}
.leaf{
  position:absolute; left:50%; top:0; width:600px; height:820px;
  transform-origin:left center; transform-style:preserve-3d;
  transition:transform .9s cubic-bezier(.45,.05,.25,1);
}
.leaf.flipped{transform:rotateY(-180deg)}
.face{
  position:absolute; inset:0; overflow:hidden; background:var(--paper);
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
}
.face.front{border-radius:2px 9px 9px 2px; box-shadow:0 1px 0 rgba(0,0,0,.06)}
.face.back{transform:rotateY(180deg); border-radius:9px 2px 2px 9px}
/* sombra del lomo */
.face.front::after{content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(to right, rgba(0,0,0,.20), rgba(0,0,0,.05) 6%, transparent 14%)}
.face.back::after{content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(to left, rgba(0,0,0,.20), rgba(0,0,0,.05) 6%, transparent 14%)}
.face .pg, .face .cover, .face .endpaper{position:absolute; inset:0}

/* ---------- Modo página única (móvil) ---------- */
.single{width:min(100%, 520px); height:100%; overflow:hidden; border-radius:10px; box-shadow:0 18px 40px -18px var(--shadow)}
.page{position:absolute; inset:0; background:var(--paper); transition:transform .38s cubic-bezier(.3,.7,.2,1), opacity .38s ease}
.page.in-right{transform:translateX(40px); opacity:0}
.page.in-left{transform:translateX(-40px); opacity:0}
.page.out-left{transform:translateX(-40px); opacity:0}
.page.out-right{transform:translateX(40px); opacity:0}
.page .pg, .page .cover, .page .endpaper{position:absolute; inset:0}

/* ---------- Páginas interiores ---------- */
.pg{
  display:flex; flex-direction:column; padding:52px 56px 74px; color:var(--ink);
  font-size:17px; line-height:1.62; hyphens:auto; -webkit-hyphens:auto;
}
.pg > *{flex-shrink:0}
.rh{display:flex; justify-content:space-between; gap:16px; margin-bottom:34px;
  font:600 10.5px/1 var(--font-display); letter-spacing:.17em; text-transform:uppercase; color:var(--ink-soft)}
.folio{position:absolute; bottom:30px; font:600 12px/1 var(--font-display); letter-spacing:.08em; color:var(--ink-soft)}
.pg.l .folio{left:56px}
.pg.r .folio{right:56px}
h2.title{margin:0 0 6px; font:800 34px/1.04 var(--font-display); letter-spacing:-.015em; text-wrap:balance}
.kicker{margin:0 0 26px; font:600 11px/1.2 var(--font-display); letter-spacing:.16em; text-transform:uppercase; color:var(--accent)}
.text p{margin:0 0 .9em; text-wrap:pretty}
.text p.dropcap::first-letter{float:left; font:800 60px/.8 var(--font-display); color:var(--accent); padding:7px 7px 0 0}
.note{margin-top:auto; padding-top:16px; border-top:1px solid var(--rule)}
.note b{display:block; margin-bottom:6px; font:700 10.5px/1 var(--font-display); letter-spacing:.17em; text-transform:uppercase; color:var(--accent)}
.note p{margin:0; font-style:italic; text-wrap:pretty}

/* Página de apertura de capítulo */
.opener{
  background-image:repeating-radial-gradient(circle at 0% 100%, transparent 0 26px, var(--accent-soft) 26px 28px);
  background-repeat:no-repeat; background-size:420px 420px; background-position:0 100%;
}
.num{margin:0; font:800 168px/.84 var(--font-display); letter-spacing:-.05em; color:var(--accent)}
.ch-label{margin:0 0 10px; font:700 11px/1 var(--font-display); letter-spacing:.2em; text-transform:uppercase; color:var(--ink-soft)}
.ch-title{margin:16px 0 0; font:800 38px/1.03 var(--font-display); letter-spacing:-.02em; text-wrap:balance}
.facts{margin:24px 0 0; display:grid; grid-template-columns:auto 1fr; gap:9px 18px; font-size:15px; line-height:1.35}
.facts dt{padding-top:3px; font:700 10px/1.2 var(--font-display); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft)}
.facts dd{margin:0}
.shot{
  margin:auto 0 0 auto; align-self:flex-end; padding:0; border:0; background:none; cursor:zoom-in;
  transform:rotate(2.4deg); transform-origin:center; transition:transform .25s ease;
}
.shot:hover{transform:rotate(0deg) scale(1.02)}
.shot img{display:block; width:auto; max-width:100%; max-height:260px; border:7px solid #F7F8F4; border-radius:3px; box-shadow:0 14px 26px -12px rgba(0,0,0,.55)}
.shot figcaption{display:none}

/* Índice */
.toc{list-style:none; margin:6px 0 0; padding:0; display:grid; gap:2px}
.toc button{
  width:100%; display:flex; align-items:baseline; gap:10px; padding:11px 8px; border:0; background:none; cursor:pointer; text-align:left;
  border-radius:8px; transition:background .15s ease;
}
.toc button:hover{background:var(--accent-soft)}
.toc .n{flex:0 0 26px; font:800 20px/1 var(--font-display); color:var(--accent)}
.toc .t{font:700 19px/1.15 var(--font-display); letter-spacing:-.01em}
.toc .dots{flex:1; min-width:16px; align-self:flex-end; border-bottom:2px dotted var(--rule); transform:translateY(-4px)}
.toc .f{font:600 13px/1 var(--font-display); color:var(--ink-soft)}
.hint{margin:auto 0 0; font-style:italic; color:var(--ink-soft); font-size:14px}

/* Portadilla */
.titlepage{justify-content:center; align-items:center; text-align:center; gap:0}
.titlepage .emb{width:150px; margin-bottom:34px}
.titlepage .emb rect{fill:none; stroke:var(--accent); stroke-width:3}
.titlepage h1{margin:0; font:800 56px/.98 var(--font-display); letter-spacing:-.03em; text-wrap:balance}
.titlepage .rule{width:56px; height:3px; background:var(--accent); margin:26px auto}
.titlepage .sub{margin:0; font-size:20px; font-style:italic}
.titlepage .by{margin:44px 0 0; font:700 12px/1.4 var(--font-display); letter-spacing:.22em; text-transform:uppercase}
.titlepage .small{margin:8px 0 0; font:500 12px/1.4 var(--font-display); letter-spacing:.08em; color:var(--ink-soft)}

/* Galería */
.gal{display:grid; gap:16px}
.gal.two{grid-template-columns:auto auto; justify-content:center; align-items:end; gap:22px; margin-top:8px}
.fig{margin:0; display:flex; flex-direction:column; gap:10px; align-items:center}
.fig button{padding:0; border:0; background:none; cursor:zoom-in}
.fig img{display:block; width:auto; height:auto; max-width:100%; border:7px solid #F7F8F4; border-radius:3px; box-shadow:0 14px 26px -12px rgba(0,0,0,.5); transition:transform .25s ease}
.fig button:hover img{transform:translateY(-3px)}
.gal.two .fig img{max-height:350px}
.fig figcaption{max-width:230px; text-align:center; font:600 12px/1.35 var(--font-display); letter-spacing:.02em; color:var(--ink-soft)}
.rows{display:grid; gap:26px; margin-top:8px}
.row{display:grid; grid-template-columns:auto 1fr; gap:22px; align-items:center}
.row img{max-height:230px; max-width:260px}
.row .cap b{display:block; font:800 24px/1.05 var(--font-display); letter-spacing:-.015em; margin-bottom:6px}
.row .cap span{font-size:15px; color:var(--ink-soft)}

/* Datos del proyecto */
.big{margin:6px 0 0; font:800 104px/.9 var(--font-display); letter-spacing:-.05em; color:var(--accent)}
.big small{font-size:34px; letter-spacing:-.01em; margin-left:6px; color:var(--ink)}
.bigcap{margin:8px 0 30px; font-size:15px; color:var(--ink-soft)}
.stats{margin:0; display:grid; grid-template-columns:auto 1fr; gap:14px 22px; align-items:baseline}
.stats dt{font:800 34px/1 var(--font-display); letter-spacing:-.02em}
.stats dd{margin:0; font-size:16px}
.colo{margin-top:auto; padding-top:16px; border-top:1px solid var(--rule); font-size:14px; color:var(--ink-soft)}
.colo b{color:var(--ink); font-weight:600}

/* ---------- Tapas ---------- */
.cover, .endpaper{
  color:var(--foil);
  background-color:var(--cover);
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 1px, transparent 1px 3px),
    radial-gradient(120% 80% at 30% 15%, rgba(255,255,255,.10), transparent 60%);
}
.cover{display:flex; flex-direction:column; padding:56px 52px 46px 60px; box-shadow:inset 14px 0 14px -10px rgba(0,0,0,.45)}
.cover::before{content:""; position:absolute; top:0; bottom:0; left:26px; width:2px; background:rgba(0,0,0,.28); box-shadow:1px 0 0 rgba(255,255,255,.08)}
.cover .eyebrow{margin:0; font:700 11px/1 var(--font-display); letter-spacing:.3em; text-transform:uppercase; opacity:.85}
.cover h1{
  margin:30px 0 0; font:800 78px/.92 var(--font-display); letter-spacing:-.035em; color:var(--foil);
  background:linear-gradient(115deg, var(--foil-hi) 0%, var(--foil) 38%, #C9A44C 58%, var(--foil-hi) 82%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
.cover .sub{margin:20px 0 0; font:600 12.5px/1.4 var(--font-display); letter-spacing:.2em; text-transform:uppercase}
.cover .track{display:block; width:100%; margin-top:auto; margin-bottom:26px; overflow:visible}
.cover .track text{font-family:var(--font-display); font-weight:800}
.cover .by{margin:0; font:700 13px/1.3 var(--font-display); letter-spacing:.24em; text-transform:uppercase}
.endpaper{
  background-image:
    repeating-radial-gradient(circle at 100% 100%, transparent 0 24px, rgba(230,200,121,.16) 24px 26px),
    repeating-radial-gradient(circle at 0% 0%, transparent 0 24px, rgba(230,200,121,.10) 24px 26px);
  background-color:var(--cover-deep);
}
.backcover{display:flex; flex-direction:column; justify-content:flex-end; align-items:center; text-align:center; padding:56px 40px 56px; gap:10px}
.backcover .mark{margin-bottom:auto; width:200px; margin-top:auto}
.backcover p{margin:0; font:700 11px/1.5 var(--font-display); letter-spacing:.24em; text-transform:uppercase}
.backcover p.soft{opacity:.7; font-weight:600}
.backcover svg rect{fill:none; stroke:var(--foil); stroke-width:2; opacity:.7}
.backcover{box-shadow:inset -14px 0 14px -10px rgba(0,0,0,.45); padding-left:40px; padding-right:52px}
.backcover::before{left:auto; right:26px}

/* ---------- Visor de imagen ---------- */
.lb{position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  padding:max(20px, env(safe-area-inset-top, 0px)) 20px max(20px, env(safe-area-inset-bottom, 0px)); background:rgba(6,14,17,.88); cursor:zoom-out}
.lb[hidden]{display:none}
.lb img{max-width:min(92vw, 760px); max-height:80vh; border:8px solid #F7F8F4; border-radius:4px; box-shadow:0 30px 60px -20px #000}
.lb p{margin:0; color:#E7EEEC; font:600 13px/1.4 var(--font-display); letter-spacing:.06em; text-align:center}
.lb button{position:absolute; top:max(14px, env(safe-area-inset-top, 0px)); right:max(14px, env(safe-area-inset-right, 0px)); width:44px; height:44px; border-radius:50%; border:0; background:rgba(255,255,255,.14); color:#fff; font-size:24px; cursor:pointer}

/* ---------- Ajustes para pantalla angosta ---------- */
.single .pg{padding:34px 26px 62px; overflow-y:auto; font-size:16.5px; -webkit-overflow-scrolling:touch}
.single .folio{display:none}
.single .rh{margin-bottom:24px; justify-content:flex-end}
.single .rh span:first-child{display:none}
.single .num{font-size:128px}
.single .ch-title{font-size:32px}
.single .shot img{max-height:200px}
.single .cover{padding:40px 30px 34px 40px}
.single .cover h1{font-size:clamp(46px, 15vw, 72px)}
.single .gal.two .fig img{max-height:250px}
.single .row{grid-template-columns:1fr}
.single .row img{max-height:200px}
.single .titlepage h1{font-size:44px}
.single .big{font-size:84px}
.single .opener{background-size:300px 300px}

@media (max-width:860px){
  .btn .lbl{display:none}
  .btn{padding:0 16px}
  #prev,#next{min-width:52px; justify-content:center}
  .status{min-width:0; flex:1 1 90px}
}
@media (prefers-reduced-motion: reduce){
  .leaf, .book, .page, .btn, .shot, .fig img{transition-duration:.01ms !important}
}
</style>
</head>
<body>


<div class="desk" id="desk" lang="es">
  <div class="stagewrap" id="wrap">
    <div class="stage" id="stage" role="group" aria-label="Libro Cinco kilómetros"></div>
  </div>
  <nav class="bar" aria-label="Controles del libro">
    <button class="btn" id="prev" type="button" aria-label="Página anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span class="lbl">Anterior</span></button>
    <span class="status" id="status" aria-live="polite"></span>
    <button class="btn" id="toc" type="button">Índice</button>
    <button class="btn primary" id="next" type="button" aria-label="Página siguiente"><span class="lbl">Siguiente</span><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </nav>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-label="Imagen ampliada">
  <button type="button" aria-label="Cerrar">&times;</button>
  <img id="lbimg" alt="">
  <p id="lbcap"></p>
</div>

<script>
(function(){

/* ---------- Estado y utilidades ---------- */
var stage = document.getElementById("stage");
var wrapEl = document.getElementById("wrap");
var prevB = document.getElementById("prev"), nextB = document.getElementById("next"), tocB = document.getElementById("toc");
var statusEl = document.getElementById("status");
var mq = window.matchMedia("(max-width: 860px)");
var mode = null, cur = 0, side = 0, leaves = [], bookEl = null, scaleEl = null, pageEl = null;
var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function el(tag, cls){ var e=document.createElement(tag); if(cls) e.className=cls; return e; }

/* ---------- Modo libro abierto ---------- */
function buildFlip(){
  stage.className = "stage flip";
  stage.innerHTML = "";
  scaleEl = el("div","book-scale"); bookEl = el("div","book");
  leaves = [];
  for (var i=0;i<N;i++){
    var leaf = el("div","leaf");
    leaf.innerHTML = '<div class="face front">'+S[2*i]+'</div><div class="face back">'+S[2*i+1]+'</div>';
    leaf.style.zIndex = (i < cur) ? (i+1) : (N-i);
    if (i < cur) leaf.classList.add("flipped");
    leaves.push(leaf); bookEl.appendChild(leaf);
  }
  scaleEl.appendChild(bookEl); stage.appendChild(scaleEl);
  updateShift(true);
}
function updateShift(){
  if(!bookEl) return;
  bookEl.classList.toggle("at-start", cur===0);
  bookEl.classList.toggle("at-end", cur===N);
}
function flipLeaf(i, flipped){
  var l = leaves[i]; if(!l) return;
  l.style.zIndex = 200;
  l.classList.toggle("flipped", flipped);
  setTimeout(function(){ l.style.zIndex = flipped ? (i+1) : (N-i); }, reduce ? 20 : 950);
}
function setCur(n){
  n = Math.max(0, Math.min(N, n));
  if (n === cur) return;
  var from = cur, dir = n > from ? 1 : -1, list = [], k;
  if (dir > 0) { for (k=from;k<n;k++) list.push(k); } else { for (k=from-1;k>=n;k--) list.push(k); }
  cur = n;
  var gap = reduce ? 0 : Math.min(130, 800/list.length);
  list.forEach(function(idx, j){ setTimeout(function(){ flipLeaf(idx, dir>0); }, j*gap); });
  updateShift(); updateUI();
}

/* ---------- Modo página única ---------- */
function makePage(s){
  var p = el("div","page");
  p.innerHTML = S[s];
  return p;
}
function buildSingle(){
  stage.className = "stage single";
  stage.innerHTML = "";
  scaleEl = null; bookEl = null; leaves = [];
  pageEl = makePage(side); stage.appendChild(pageEl);
}
function setSide(s){
  s = Math.max(0, Math.min(TOTAL-1, s));
  if (s === side) return;
  var dir = s > side ? 1 : -1;
  side = s;
  var old = pageEl;
  pageEl = makePage(side);
  if (!reduce){
    pageEl.classList.add(dir>0 ? "in-right" : "in-left");
    stage.appendChild(pageEl);
    void pageEl.offsetWidth;
    pageEl.classList.remove("in-right","in-left");
    old.classList.add(dir>0 ? "out-left" : "out-right");
    setTimeout(function(){ if(old.parentNode) old.parentNode.removeChild(old); }, 420);
  } else {
    stage.appendChild(pageEl); old.parentNode.removeChild(old);
  }
  updateUI();
}

/* ---------- Escala y ajuste ---------- */
function fit(){
  if (mode !== "flip") { stage.style.width = ""; stage.style.height = ""; return; }
  var vw = wrapEl.clientWidth, vh = wrapEl.clientHeight;
  var s = Math.min((vw-8)/1200, (vh-34)/820, 1.3);
  if (s < .3) s = .3;
  stage.style.width = (1200*s)+"px";
  stage.style.height = (820*s)+"px";
  scaleEl.style.transform = "scale("+s+")";
}

/* ---------- Interfaz ---------- */
function updateUI(){
  var label, atStart, atEnd;
  if (mode === "flip"){
    atStart = cur===0; atEnd = cur===N;
    if (cur===0) label = "Portada";
    else if (cur===N) label = "Contraportada";
    else if (cur===1) label = "Portadilla";
    else label = "Págs. "+folioOf(2*cur-1)+"–"+folioOf(2*cur)+" de 20";
  } else {
    atStart = side===0; atEnd = side===TOTAL-1;
    var f = folioOf(side);
    label = side===0 ? "Portada" : side===TOTAL-1 ? "Contraportada" : f ? "Pág. "+f+" de 20" : (side===1?"Guarda":"Portadilla");
  }
  statusEl.textContent = label;
  prevB.disabled = atStart; nextB.disabled = atEnd;
  nextB.querySelector(".lbl").textContent = (atStart ? "Abrir" : "Siguiente");
}
function next(){ mode==="flip" ? setCur(cur+1) : setSide(side+1); }
function prev(){ mode==="flip" ? setCur(cur-1) : setSide(side-1); }
function goTo(s){
  if (mode==="flip") setCur(Math.ceil(s/2)); else setSide(s);
}
function build(){
  var wasMode = mode;
  var nm = mq.matches ? "single" : "flip";
  if (wasMode === "flip") { side = cur===0 ? 0 : (cur===N ? TOTAL-1 : 2*cur); }
  if (wasMode === "single") { cur = Math.ceil(side/2); }
  mode = nm;
  if (mode === "flip") buildFlip(); else buildSingle();
  fit(); updateUI();
}

/* ---------- Eventos ---------- */
prevB.addEventListener("click", prev);
nextB.addEventListener("click", next);
tocB.addEventListener("click", function(){ goTo(3); });
document.addEventListener("keydown", function(e){
  if (!document.getElementById("lb").hidden){ if(e.key==="Escape") closeLB(); return; }
  if (e.key==="ArrowRight" || e.key==="PageDown") next();
  else if (e.key==="ArrowLeft" || e.key==="PageUp") prev();
  else if (e.key==="Home") goTo(0);
  else if (e.key==="End") goTo(TOTAL-1);
});
window.addEventListener("resize", fit);
(mq.addEventListener ? mq.addEventListener("change", build) : mq.addListener(build));

stage.addEventListener("click", function(e){
  if (Date.now() - lastSwipe < 450) return;
  var go = e.target.closest("[data-go]");
  if (go){ goTo(parseInt(go.getAttribute("data-go"),10)); return; }
  var lb = e.target.closest("[data-lb]");
  if (lb){ openLB(lb.getAttribute("data-lb"), lb.getAttribute("data-cap")); return; }
  if (mode === "flip"){
    var r = stage.getBoundingClientRect();
    if (e.clientX > r.left + r.width/2) { if (cur < N) next(); }
    else { if (cur > 0) prev(); }
  }
});
stage.addEventListener("keydown", function(e){
  if ((e.key==="Enter" || e.key===" ") && e.target.matches("[data-lb]")){
    e.preventDefault(); openLB(e.target.getAttribute("data-lb"), e.target.getAttribute("data-cap"));
  }
});

/* deslizar con el dedo */
var sx=0, sy=0, sid=null, lastSwipe=0;
stage.addEventListener("pointerdown", function(e){ sx=e.clientX; sy=e.clientY; sid=e.pointerId; });
stage.addEventListener("pointerup", function(e){
  if (sid !== e.pointerId) return; sid = null;
  var dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.6){ lastSwipe = Date.now(); dx < 0 ? next() : prev(); }
});

/* visor de imágenes */
var lb = document.getElementById("lb"), lbimg = document.getElementById("lbimg"), lbcap = document.getElementById("lbcap");
function openLB(key, cap){ lbimg.src = IMG[key]; lbimg.alt = cap || ""; lbcap.textContent = cap || ""; lb.hidden = false; lb.querySelector("button").focus(); }
function closeLB(){ lb.hidden = true; lbimg.removeAttribute("src"); }
lb.addEventListener("click", closeLB);

build();
})();
</script>
